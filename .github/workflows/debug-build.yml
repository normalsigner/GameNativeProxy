name: Debug APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Free disk space
      run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift

    - name: Add swap
      run: |
        sudo fallocate -l 8G /mnt/swapfile.ci
        sudo chmod 600 /mnt/swapfile.ci
        sudo mkswap /mnt/swapfile.ci
        sudo swapon /mnt/swapfile.ci

    - uses: actions/checkout@v4

    - name: set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Dummy credentials
      run: |
        cat <<EOF > local.properties
        POSTHOG_API_KEY="dummy"
        POSTHOG_HOST="https://localhost"
        STEAMGRIDDB_API_KEY="dummy"
        CLOUD_PROJECT_NUMBER="0"
        EOF

    - name: Build debug APK
      run: ./gradlew -Pkotlin.daemon.jvmargs=-Xmx3g :app:assembleModernDebug

    - uses: actions/upload-artifact@v4
      with:
        name: gamenative-debug
        path: app/build/outputs/apk/**/*.apk